<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>景区经营数据看板（演示） · 计奕佳</title>
    <meta
      name="description"
      content="脱敏演示看板 — 复刻企业看板的信息层级与配色，数据均为虚构。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <header class="dash-header">
      <div class="dash-header__inner">
        <a class="dash-back" href="index.html#projects">← 返回作品集</a>
        <p class="dash-note" data-dash="note"></p>
      </div>
    </header>

    <main class="dash-main">
      <div class="dash-main__inner">
        <!-- 大卡片容器 -->
        <article class="board">
          <!-- 顶部横向概览 -->
          <section class="board__overview" aria-label="概览">
            <div class="board__title-row">
              <h1 class="board__title" data-dash="title"></h1>
              <p class="board__subtitle" data-dash="subtitle"></p>
            </div>
            <div class="overview" data-dash="overview"></div>
          </section>

          <div class="board__body">
            <!-- 左栏 -->
            <div class="board__col board__col--left">
              <section class="panel" aria-label="AOI指标表">
                <h2 class="panel__title" data-aoi="title"></h2>
                <div class="panel__body" id="aoi-table"></div>
              </section>
              <section class="panel" aria-label="GTV拆分">
                <h2 class="panel__title" data-gtv="title"></h2>
                <div class="panel__body" id="gtv-chart"></div>
              </section>
            </div>

            <!-- 右栏 -->
            <div class="board__col board__col--right">
              <section class="panel" aria-label="指标速览">
                <h2 class="panel__title" data-kpi="title"></h2>
                <div class="panel__body" id="kpi-cards"></div>
              </section>
              <section class="panel" aria-label="同比分析">
                <h2 class="panel__title" data-compare="title"></h2>
                <div class="panel__body" id="compare-chart"></div>
              </section>
            </div>
          </div>

          <!-- 底部关键结论 -->
          <section class="board__conclusions" aria-label="关键结论">
            <h2 class="panel__title">关键结论</h2>
            <div class="conclusions" data-dash="conclusions"></div>
          </section>
        </article>
      </div>
    </main>

    <footer class="dash-footer">
      <p>演示用脱敏数据 · © 计奕佳</p>
    </footer>

    <script src="data/dashboard-data.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
